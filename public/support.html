<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support – SVT MATCH</title>
  <link rel="icon" type="image/png" href="imgs/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" onload="this.rel='stylesheet'" />
  <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" onload="this.rel='stylesheet'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  </noscript>
  <link rel="stylesheet" href="/shared/svt.css" />

  <!-- Firebase -->

  <style>




    /* ── SHARED STYLES FROM GAME.HTML ── */

    .input-field {
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid transparent;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      color: var(--text);
    }
    .input-field:focus {
      border-color: var(--pink-deep);
      outline: none;
    }

    .btn-svt { padding: 12px 20px; border-radius: 14px; font-weight: 700; font-size: 14px; }


    /* ═══════════════════════════════════════════════
       LOGIN SCREEN — redesigned to match screenshot
    ═══════════════════════════════════════════════ */
    #loginScreen { display: none; flex-direction: column; min-height: 100vh; max-width: 430px; margin: 0 auto; }
    #loginScreen.active { display: flex; }

    /* Gradient header */
    .login-header {
      background: transparent;
      border-radius: 0 0 36px 36px;
      padding: 20px 20px 36px;
      position: relative;
    }

    /* Top bar inside header */
    .login-topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 24px;
    }

    .login-topbar-title {
      font-size: 15px; font-weight: 700; color: white;
      letter-spacing: 0.3px;
    }

    /* Icon + title row */
    .login-hero-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .login-app-icon {
      width: 56px; height: 56px;
      background: rgba(255,255,255,0.22);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; color: white;
      backdrop-filter: blur(8px);
      border: 1.5px solid rgba(255,255,255,0.35);
      flex-shrink: 0;
    }
    .login-hero-text .login-title {
      font-size: 28px; font-weight: 800; color: white;
      line-height: 1.1; letter-spacing: -0.3px;
    }
    .login-hero-text .login-subtitle {
      font-size: 13px; font-weight: 500;
      color: rgba(255,255,255,0.80);
      margin-top: 2px;
    }

    /* Form body */
    .login-body {
      flex: 1;
      padding: 36px 28px 32px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;

      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(2px);
    }

    .login-field { margin-bottom: 22px; }
    .login-field-label {
      font-size: 13px; font-weight: 600;
      color: #334155; margin-bottom: 8px; display: block;
    }
    /* Replace .login-field-wrap and related rules */
    .login-field-wrap {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.95);
      border: 1.5px solid rgba(226, 232, 240, 0.9);
      border-radius: 14px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      overflow: hidden;
      margin-bottom: 18px;
    }

    /* The icon inside the wrap (left side) */
    .login-field-icon {
      color: #94a3b8;
      font-size: 14px;
      padding: 0 12px;           /* spacing around the icon */
      flex-shrink: 0;
    }

    /* The actual input – now takes all remaining space */
    .login-input {
      flex: 1;
      padding: 14px 8px;
      background: transparent;
      border: none;
      border-radius: 0;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      color: var(--text);
      outline: none;
      box-shadow: none;
      appearance: none;
      -webkit-appearance: none;
      -webkit-tap-highlight-color: transparent;
    }
    .login-input:focus {
      outline: none;
      box-shadow: none;
    }
    /* Add this after your existing .login-input rules */
    .login-field-wrap .login-input,
    .login-field-wrap .login-input:focus {
      border: none !important;
      box-shadow: none !important;
      outline: none !important;
      background: transparent !important;
    }

    /* Focus state on the wrapper */
    .login-field-wrap:focus-within {
      border-color: var(--pink-deep);
      box-shadow: 0 0 0 4px rgba(232, 136, 158, 0.12);
    }

    /* Password toggle button (right side) */
    .login-pw-toggle { width: 34px; height: 34px; margin-right: 6px; border-radius: 10px; font-size: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .loading-spinner { width: 22px; height: 22px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #0f172a; border-radius: 50%; margin: 0 auto; }

    /* Placeholder styling remains */
    .login-input::placeholder {
      color: #b0bec5;
    }
    
    /* Login button */
    .login-btn { width: 100%; padding: 16px; border-radius: 16px; font-size: 16px; font-weight: 700; margin-top: 8px; letter-spacing: 0.3px; }

    /* Login error banner */
    .login-error-banner {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #dc2626;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
      font-weight: 600;
    }

    /* ── SUPPORT SCREEN ── */
    #supportScreen { display: none; }
    #supportScreen.active { display: block; }

    /* ── SHARED CONTAINER ── */
    .container { max-width: 680px; margin: 0 auto; padding: 0 20px 60px; }

    header { display: flex; align-items: center; gap: 16px; padding: 32px 0 20px; }
    .page-title { font-size: 26px; font-weight: 900; }

    .user-chip { display: flex; align-items: center; gap: 8px; border-radius: 12px; padding: 8px 12px; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 16px; }
    .user-chip i { color: var(--pink-deep); }

    /* ── TAB BAR ── */
    .tab-bar { display: flex; gap: 8px; margin-bottom: 20px; border-radius: 18px; padding: 5px; }
    .tab-btn { flex: 1; padding: 10px 14px; border-radius: 13px; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 7px; }

    /* ── FORM CARD ── */
    .form-card { border-radius: 24px; padding: 28px; box-shadow: 0 8px 32px rgba(0,0,0,0.08); }

    .field { margin-bottom: 20px; }
    label {
      display: block; font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px;
      color: #64748b; margin-bottom: 8px;
    }
    label span { color: var(--pink-deep); margin-left: 2px; }

    input[type="email"], input[type="text"], textarea {
      width: 100%; padding: 14px 16px;
      background: rgba(255,255,255,0.9); border: 2px solid transparent;
      border-radius: 14px; font-family: 'Poppins', sans-serif;
      font-size: 14px; color: var(--text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease; outline: none;
    }
    input[type="email"]:focus, input[type="text"]:focus, textarea:focus {
      border-color: var(--pink-deep); box-shadow: 0 0 0 4px rgba(232,136,158,0.12);
    }
    textarea { resize: vertical; min-height: 130px; line-height: 1.6; }
    input::placeholder, textarea::placeholder { color: #94a3b8; }

    .category-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; }

    .btn-submit { width: 100%; padding: 16px; border-radius: 16px; font-size: 15px; font-weight: 700; margin-top: 8px; }

    /* SUCCESS STATE */
    .success-screen { display: none; text-align: center; padding: 40px 20px; }
    .success-screen.show { display: block; }
    .form-card.hidden { display: none; }
    .success-icon { width: 80px; height: 80px; background: linear-gradient(135deg, var(--pink), var(--blue)); border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 36px; }
    .success-title { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
    .success-msg   { font-size: 14px; color: #64748b; line-height: 1.6; margin-bottom: 24px; }
    .btn-back { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 14px; font-size: 14px; font-weight: 600; }

    .error-msg {
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
      color: #dc2626; border-radius: 10px; padding: 10px 14px;
      font-size: 13px; margin-top: 10px; display: none;
    }

    /* ── MY SUBMISSIONS ── */
    #mySubmissionsSection { display: none; }
    #mySubmissionsSection.active { display: block; }

    .submissions-toggle-bar { display: flex; gap: 8px; margin-bottom: 16px; border-radius: 16px; padding: 5px; }
    .tpb { flex: 1; padding: 9px 14px; border-radius: 11px; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .tab-btn .badge { background: rgba(255,255,255,0.3); color: white; font-size: 10px; font-weight: 800; border-radius: 20px; padding: 1px 7px; min-width: 20px; text-align: center; }
    .tab-btn:not(.active) .badge, .tpb:not(.active) .tpb-count { background: rgba(232,136,158,0.15); color: var(--pink-deep); }
    .tpb .tpb-count {
      font-size: 10px; font-weight: 800; padding: 1px 7px;
      border-radius: 20px;
      background: rgba(255,255,255,0.3); color: white;
    }

    .submissions-panel { border-radius: 20px; padding: 18px; }

    .sub-card { border-radius: 14px; padding: 14px; margin-bottom: 10px; cursor: pointer; }
    .sub-card:hover { box-shadow: 0 6px 18px rgba(0,0,0,0.09); transform: translateY(-1px); }

    .sub-card-top-row {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 8px;
    }
    .sub-card-title-wrap { flex: 1; min-width: 0; }
    .sub-card-title { font-size: 13px; font-weight: 700; line-height: 1.3; }
    .sub-card-type  { font-size: 10px; font-weight: 600; color: var(--muted); margin-top: 2px; }

    .status-badge {
      flex-shrink: 0; font-size: 9px; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.5px;
      padding: 3px 9px; border-radius: 20px;
    }
    .status-pending {
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.28);
      color: #dc2626;
    }
    .status-open, .status-resolved {
      background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.28);
      color: #16a34a;
    }

    .sub-card-opened-by {
      font-size: 10px; margin-top: 4px;
      color: var(--blue-deep); font-weight: 600;
    }
    .sub-card-time { font-size: 10px; color: var(--faint); margin-top: 4px; }

    .card-divider {
      border: none; border-top: 1px solid rgba(0,0,0,0.08); margin: 10px 0;
    }

    .sub-detail { display: none; margin-top: 10px; }
    .sub-card.expanded .sub-detail { display: block; }

    .detail-val { font-size: 12px; color: var(--text); line-height: 1.6; word-break: break-word; }

    .chat-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.07); }
    .chat-section-title {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.8px; color: var(--faint); margin-bottom: 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .chat-messages {
      height: 180px; overflow-y: auto; padding: 10px;
      background: rgba(255,255,255,0.45);
      border-radius: 12px; border: 1px solid rgba(255,255,255,0.7); margin-bottom: 8px;
    }
    .chat-msg { margin-bottom: 8px; display: flex; flex-direction: column; }
    .chat-msg-admin { align-items: flex-start; }
    .chat-msg-user  { align-items: flex-end; }
    .chat-bubble {
      max-width: 82%; padding: 8px 12px; border-radius: 12px;
      font-size: 12px; line-height: 1.5; word-break: break-word;
    }
    .chat-msg-admin .chat-bubble {
      background: rgba(255,255,255,0.97); color: var(--text);
      border: 1px solid rgba(0,0,0,0.08); border-bottom-left-radius: 3px;
    }
    .chat-msg-user .chat-bubble {
      background: var(--svt-accent);
      color: white; border-bottom-right-radius: 3px;
    }
    .chat-meta { font-size: 9px; color: var(--faint); margin-top: 2px; }
    .chat-empty { text-align: center; padding: 18px; color: var(--faint); font-size: 11px; }
    .chat-input-row { display: flex; gap: 6px; align-items: center; }
    .chat-input {
      flex: 1; padding: 9px 12px; font-size: 12px;
      background: rgba(255,255,255,0.9); border: 2px solid transparent;
      border-radius: 10px; font-family: 'Poppins', sans-serif;
      color: var(--text); outline: none; transition: border-color 0.2s;
    }
    .chat-input:focus { border-color: var(--pink-deep); }
    .chat-send-btn { width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; font-size: 13px; display: flex; align-items: center; justify-content: center; }
    .chat-resolved-note {
      font-size: 11px; color: #16a34a; background: rgba(34,197,94,0.08);
      border: 1px solid rgba(34,197,94,0.2); border-radius: 8px;
      padding: 7px 10px; margin-top: 8px; text-align: center; font-weight: 600;
    }

    .empty-state {
      text-align: center; padding: 24px 12px;
      color: var(--faint); font-size: 12px; line-height: 1.7;
    }
    .empty-state .empty-icon { font-size: 28px; margin-bottom: 8px; }

    .submissions-loading {
      text-align: center; padding: 20px;
      color: var(--faint); font-size: 12px;
    }

    /* Loading overlay */
    #loadingOverlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; z-index: 100;
    }
    #loadingOverlay .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(232,136,158,0.3);
      border-top-color: var(--pink-deep);
      border-radius: 50%; animation: svt-spin 0.9s linear infinite;
    }
    #loadingOverlay p { font-size: 13px; font-weight: 600; color: #64748b; }
  </style>
</head>
<body>

  <!-- Loading overlay -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <p>Loading…</p>
  </div>

  <!-- ══ LOGIN SCREEN ══════════════════════════════════════════════════════ -->
  <div id="loginScreen">

  <div class="login-header">
    <!-- topbar -->
    <div class="login-topbar">
      <span class="login-topbar-title">SVT Match Support</span>
    </div>

    <!-- logo + title -->
    <div style="display:flex; flex-direction:column; align-items:center; gap:14px; margin-top:8px;">
      <div style="width:96px; height:96px; background:rgba(255,255,255,0.22); border-radius:28px; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(8px); border:2px solid rgba(255,255,255,0.40); box-shadow:0 8px 24px rgba(0,0,0,0.12); overflow:hidden;">
        <img src="imgs/logo.png" alt="SVT MATCH" style="width:80px; height:80px; object-fit:contain;" />
      </div>
      <div class="login-hero-text" style="text-align:center;">
        <div class="login-title">Login</div>
        <div class="login-subtitle">to access support</div>
      </div>
    </div>
  </div>  <!-- ✅ closes .login-header -->

  <!-- Form body is now a sibling of login-header, not a child -->
  <div class="login-body">

    <div class="login-field-wrap">
      <i class="fas fa-at login-field-icon"></i>
      <input type="text" id="loginUsername" class="login-input" placeholder="Enter your username" autocomplete="username" />
    </div>

    <div class="login-field-wrap">
      <i class="fas fa-lock login-field-icon"></i>
      <input type="password" id="loginPassword" class="login-input" placeholder="Enter your password" autocomplete="current-password" />
      <button type="button" class="login-pw-toggle" onclick="toggleLoginPw(this)">
        <i class="fas fa-eye"></i>
      </button>
    </div>

    <button class="login-btn" id="loginBtn" onclick="handleLogin()">Login</button>
    <div class="login-error-banner" id="loginError"></div>

  </div>  <!-- ✅ closes .login-body -->

</div>  <!-- ✅ closes #loginScreen — supportScreen is now a sibling, not a child -->

  <!-- ══ SUPPORT SCREEN ══════════════════════════════════════════ -->
  <div id="supportScreen">
    <div class="container">
      <header>
        <div>
          <div class="page-title">Support</div>
        </div>
      </header>

      <!-- Logged-in user chip -->
      <div class="user-chip" id="userChip">
        <i class="fas fa-user-circle"></i>
        <span id="userChipText">Loading…</span>
      </div>

      <!-- Tab bar -->
      <div class="tab-bar">
        <button class="tab-btn active" id="tabNewTicket" onclick="switchTab('newTicket')">
          <i class="fas fa-pen"></i> New Ticket
        </button>
        <button class="tab-btn" id="tabMySubmissions" onclick="switchTab('mySubmissions')">
          <i class="fas fa-inbox"></i> My Submissions
          <span class="badge" id="submissionsCountBadge" style="display:none;">0</span>
        </button>
      </div>

      <!-- ── TAB: NEW TICKET ── -->
      <div id="newTicketSection">
        <div class="form-card" id="formCard">
          <div class="field">
            <label>Category</label>
            <div class="category-chips">
              <div class="chip active" data-val="Bug Report"    onclick="selectChip(this)">🐛 Bug Report</div>
              <div class="chip"        data-val="Account Issue" onclick="selectChip(this)">🔐 Account Issue</div>
              <div class="chip"        data-val="Refunds"       onclick="selectChip(this)">💸 Refunds</div>
              <div class="chip"        data-val="Feedback"      onclick="selectChip(this)">💡 Feedback</div>
              <div class="chip"        data-val="Others"        onclick="selectChip(this)">📌 Others</div>
            </div>
          </div>

          <div class="field">
            <label>Email Address <span>*</span></label>
            <input type="email" id="emailInput" placeholder="your@email.com" required />
          </div>

          <div class="field">
            <label>Title <span>*</span></label>
            <input type="text" id="titleInput" placeholder="Brief summary of your issue" required />
          </div>

          <div class="field">
            <label>Description <span>*</span></label>
            <textarea id="descInput" placeholder="Describe your issue or feedback in detail. Include any steps to reproduce the problem if applicable."></textarea>
          </div>

          <div class="error-msg" id="errorMsg"></div>

          <button class="btn-submit" id="submitBtn" onclick="submitForm()">
            <i class="fas fa-paper-plane" style="margin-right:8px;"></i>Submit
          </button>
        </div>

        <div class="success-screen" id="successScreen">
          <div class="success-icon">💌</div>
          <div class="success-title">Ticket Submitted!</div>
          <div class="success-msg">
            Thanks for reaching out! We've received your support request and will get back to you as soon as possible.
          </div>
          <button class="btn-back" onclick="afterSubmitReset()">
            <i class="fas fa-inbox"></i> View My Submissions
          </button>
        </div>
      </div>

      <!-- ── TAB: MY SUBMISSIONS ── -->
      <div id="mySubmissionsSection">
        <div class="submissions-toggle-bar">
          <button class="tpb active" id="tpbPending" onclick="setSubmissionsView('pending')">
            ⏳ Pending <span class="tpb-count" id="pendingCount">0</span>
          </button>
          <button class="tpb" id="tpbOpened" onclick="setSubmissionsView('opened')">
            💬 Opened <span class="tpb-count" id="openedCount">0</span>
          </button>
        </div>

        <div class="submissions-panel" id="pendingPanel">
          <div id="pendingList">
            <div class="submissions-loading"><i class="fas fa-spinner fa-spin"></i> Loading…</div>
          </div>
        </div>

        <div class="submissions-panel" id="openedPanel" style="display:none;">
          <div id="openedList">
            <div class="submissions-loading"><i class="fas fa-spinner fa-spin"></i> Loading…</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
    /* ─────────────────────────────────────────────────────────
       Firebase init
    ───────────────────────────────────────────────────────── */
    const firebaseConfig = {
      apiKey: "AIzaSyBfpCJrqAul3meDQ764dUetTxQvf0_iOK8",
      authDomain: "svt-match.firebaseapp.com",
      databaseURL: "https://svt-match-default-rtdb.firebaseio.com",
      projectId: "svt-match",
      storageBucket: "svt-match.firebasestorage.app",
      messagingSenderId: "16709407764",
      appId: "1:16709407764:android:85fc7f8e04478fbe0c4301"
    };

    firebase.initializeApp(firebaseConfig);
    const db   = firebase.firestore();
    const rtdb = firebase.database();
    const auth = firebase.auth();

    /* ─────────────────────────────────────────────────────────
       State
    ───────────────────────────────────────────────────────── */
    let currentUser      = null;
    let selectedCategory = 'Bug Report';
    let myTickets        = [];
    let submissionsUnsub = null;
    let chatListeners    = {};
    let expandedCards    = new Set();
    let submissionsViewMode = 'pending';

    /* ─────────────────────────────────────────────────────────
       Helpers
    ───────────────────────────────────────────────────────── */
    function usernameToEmail(u) {
      return `${String(u).trim().toLowerCase()}@svtmatch.app`;
    }

    async function loadUserProfile(uid) {
      const snap = await rtdb.ref(`users/${uid}`).once('value');
      return snap.val();
    }

    /* ─────────────────────────────────────────────────────────
       Auth state
    ───────────────────────────────────────────────────────── */
    auth.onAuthStateChanged(async (firebaseUser) => {
  try {
    if (firebaseUser) {
      const profile = await loadUserProfile(firebaseUser.uid);
      currentUser = {
        id: firebaseUser.uid,
        username: profile?.username || firebaseUser.email?.split('@')[0] || '—',
        displayName: profile?.displayName || profile?.username || '—'
      };
      localStorage.setItem('currentUserProfile', JSON.stringify(currentUser));
      showSupportScreen();
    } else {
      currentUser = null;
      localStorage.removeItem('currentUser');
      showLoginScreen();
    }
  } catch (error) {
    console.error('Auth error:', error);
    // fallback: force-show login or support based on what we have
    // but at least we'll remove the overlay
  } finally {
    hideLoading();   // ✅ always called
  }
});

    /* ─────────────────────────────────────────────────────────
       Screen helpers
    ───────────────────────────────────────────────────────── */
    function hideLoading() {
      const _ov = document.getElementById('loadingOverlay');
      _ov.style.opacity = '0'; _ov.style.pointerEvents = 'none';
      setTimeout(() => { _ov.style.display = 'none'; }, 300);
    }

    function showLoginScreen() {
      document.getElementById('loginScreen').classList.add('active');
      document.getElementById('supportScreen').classList.remove('active');
    }

    function showSupportScreen() {
  document.getElementById('loginScreen').classList.remove('active');
  document.getElementById('supportScreen').classList.add('active');
  
  const chip = document.getElementById('userChipText');
  if (chip && currentUser) {
    chip.textContent = `${currentUser.displayName} (@${currentUser.username})`;
  }
  
  // Only start the listener when we truly have a Firebase user
  if (currentUser?.id) {
    startSubmissionsListener();
  }
  hideLoading();
}

    /* ─────────────────────────────────────────────────────────
       Login
    ───────────────────────────────────────────────────────── */
    function toggleLoginPw(btn) {
      const input = document.getElementById('loginPassword');
      const icon  = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    function setLoginError(msg) {
      const el = document.getElementById('loginError');
      el.textContent = msg;
      el.style.display = msg ? 'block' : 'none';
    }

    function setLoginLoading(loading) {
      const btn = document.getElementById('loginBtn');
      if (loading) {
        btn.disabled = true;
        btn.innerHTML = '<div class="loading-spinner" style="border-top-color:white;"></div>';
      } else {
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    }

    async function handleLogin() {
      const username = document.getElementById('loginUsername').value.trim().toLowerCase();
      const password = document.getElementById('loginPassword').value;

      if (!username || !password) {
        setLoginError('Please fill in all fields.');
        return;
      }

      setLoginLoading(true);
      setLoginError('');

      try {
        const fakeEmail = usernameToEmail(username);

        try {
          const cred = await auth.signInWithEmailAndPassword(fakeEmail, password);
          const profile = await loadUserProfile(cred.user.uid);
          currentUser = {
            id: cred.user.uid,
            username: profile?.username || username,
            displayName: profile?.displayName || profile?.username || username
          };
          localStorage.setItem('currentUser', JSON.stringify(currentUser));
          showSupportScreen();
          return;
        } catch (authErr) {
          const notFound = [
            'auth/user-not-found',
            'auth/invalid-credential',
            'auth/invalid-email'
          ].includes(authErr.code);

          if (!notFound) {
            setLoginError(
              authErr.code === 'auth/wrong-password'
                ? 'Incorrect password.'
                : 'Login failed: ' + authErr.message
            );
            return;
          }
        }
        setLoginError('Account not found. Check your username and password, or create an account in the game first.');
        return;

      } catch (e) {
        setLoginError('Login failed: ' + e.message);
      } finally {
        setLoginLoading(false);
      }
    }

    document.getElementById('loginPassword')?.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });
    document.getElementById('loginUsername')?.addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('loginPassword')?.focus();
    });

    /* ─────────────────────────────────────────────────────────
       Tab switching
    ───────────────────────────────────────────────────────── */
    function switchTab(tab) {
      const isNew = tab === 'newTicket';
      document.getElementById('tabNewTicket').classList.toggle('active', isNew);
      document.getElementById('tabMySubmissions').classList.toggle('active', !isNew);
      document.getElementById('newTicketSection').style.display = isNew ? 'block' : 'none';
      document.getElementById('mySubmissionsSection').style.display = isNew ? 'none' : 'block';
    }

    function setSubmissionsView(mode) {
      submissionsViewMode = (mode === 'opened') ? 'opened' : 'pending';
      document.getElementById('tpbPending').classList.toggle('active', submissionsViewMode === 'pending');
      document.getElementById('tpbOpened').classList.toggle('active',  submissionsViewMode === 'opened');
      document.getElementById('pendingPanel').style.display = submissionsViewMode === 'pending' ? 'block' : 'none';
      document.getElementById('openedPanel').style.display  = submissionsViewMode === 'opened'  ? 'block' : 'none';
      renderMySubmissions();
    }

    /* ─────────────────────────────────────────────────────────
       Support form
    ───────────────────────────────────────────────────────── */
    function selectChip(el) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      selectedCategory = el.dataset.val;
    }

    async function submitForm() {
      const email       = document.getElementById('emailInput').value.trim();
      const title       = document.getElementById('titleInput').value.trim();
      const description = document.getElementById('descInput').value.trim();
      const errorEl     = document.getElementById('errorMsg');
      const submitBtn   = document.getElementById('submitBtn');

      errorEl.style.display = 'none';

      if (!email || !title || !description) {
        errorEl.textContent = 'Please fill in all required fields.';
        errorEl.style.display = 'block'; return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        errorEl.textContent = 'Please enter a valid email address.';
        errorEl.style.display = 'block'; return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i> Submitting…';

      try {
        await db.collection('support').add({
          category:    selectedCategory,
          email,
          title,
          description,
          userId:      currentUser?.id      || null,
          username:    currentUser?.username || null,
          displayName: currentUser?.displayName || null,
          status:      'pending',
          submittedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById('formCard').classList.add('hidden');
        document.getElementById('successScreen').classList.add('show');

      } catch (err) {
        console.error(err);
        errorEl.textContent = 'Something went wrong. Please try again.';
        errorEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-paper-plane" style="margin-right:8px;"></i> Submit';
      }
    }

    function afterSubmitReset() {
      document.getElementById('formCard').classList.remove('hidden');
      document.getElementById('successScreen').classList.remove('show');
      document.getElementById('emailInput').value = '';
      document.getElementById('titleInput').value = '';
      document.getElementById('descInput').value  = '';
      switchTab('mySubmissions');
    }

    /* ─────────────────────────────────────────────────────────
       Helper: strip domain from admin username
    ───────────────────────────────────────────────────────── */
    function cleanAdminName(raw) {
      if (!raw) return 'Admin';
      const idx = raw.indexOf('@');
      return idx !== -1 ? raw.substring(0, idx) : raw;
    }

    /* ─────────────────────────────────────────────────────────
       My Submissions — live listener
    ───────────────────────────────────────────────────────── */
    function startSubmissionsListener() {
      if (!currentUser?.id) return;
      if (submissionsUnsub) submissionsUnsub();

      submissionsUnsub = db.collection('support')
        .where('userId', '==', currentUser.id)
        .orderBy('submittedAt', 'desc')
        .onSnapshot(snap => {
          myTickets = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          renderMySubmissions();
        }, err => {
          console.error('Submissions listener error:', err);
        });
    }

    function renderMySubmissions() {
      const pending = myTickets.filter(t => t.status === 'pending');
      const opened  = myTickets.filter(t => t.status === 'open' || t.status === 'resolved');
      const total   = myTickets.length;

      const badge = document.getElementById('submissionsCountBadge');
      if (total > 0) { badge.textContent = total; badge.style.display = 'inline'; }
      else           { badge.style.display = 'none'; }

      document.getElementById('pendingCount').textContent = pending.length;
      document.getElementById('openedCount').textContent  = opened.length;

      if (submissionsViewMode === 'opened') renderOpenedList(opened);
      else                                  renderPendingList(pending);
    }

    function fmtTime(ts) {
      if (!ts) return '—';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleString('en-HK', {
        timeZone: 'Asia/Hong_Kong',
        month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function escHtml(str) {
      return String(str || '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function renderPendingList(tickets) {
      const el = document.getElementById('pendingList');
      if (!tickets.length) {
        el.innerHTML = `<div class="empty-state">
          <div class="empty-icon">📭</div>
          No pending submissions.<br>Submit a ticket above!
        </div>`; return;
      }
      el.innerHTML = tickets.map(t => `
        <div class="sub-card ${expandedCards.has(t.id) ? 'expanded' : ''}"
             onclick="toggleCard('${t.id}', 'pending')" id="card-${t.id}">
          <div class="sub-card-top-row">
            <div class="sub-card-title-wrap">
              <div class="sub-card-title">${escHtml(t.title)}</div>
              <div class="sub-card-type">${escHtml(t.category || '—')}</div>
            </div>
            <span class="status-badge status-pending">Pending</span>
          </div>
          <div class="sub-card-time">
            <i class="fas fa-clock" style="margin-right:4px;"></i>${fmtTime(t.submittedAt)}
          </div>
          <div class="sub-detail">
            <hr class="card-divider">
            <div class="detail-val" style="white-space:pre-wrap;">${escHtml(t.description)}</div>
          </div>
        </div>
      `).join('');
    }

    function renderOpenedList(tickets) {
      const el = document.getElementById('openedList');
      if (!tickets.length) {
        el.innerHTML = `<div class="empty-state">
          <div class="empty-icon">💬</div>
          No opened tickets yet.<br>An admin will review your submissions.
        </div>`; return;
      }
      el.innerHTML = tickets.map(t => {
        const isResolved  = t.status === 'resolved';
        const statusClass = isResolved ? 'status-resolved' : 'status-open';
        const statusLabel = isResolved ? 'Resolved' : 'Open';
        const expanded    = expandedCards.has(t.id);
        return `
        <div class="sub-card ${expanded ? 'expanded' : ''}"
             id="card-${t.id}" onclick="toggleCard('${t.id}', 'opened')">
          <div class="sub-card-top-row">
            <div class="sub-card-title-wrap">
              <div class="sub-card-title">${escHtml(t.title)}</div>
              <div class="sub-card-type">${escHtml(t.category || '—')}</div>
            </div>
            <span class="status-badge ${statusClass}">${statusLabel}</span>
          </div>
          ${t.openedBy
            ? `<div class="sub-card-opened-by">
                 <i class="fas fa-user-shield" style="margin-right:4px;"></i>Opened by ${escHtml(cleanAdminName(t.openedBy))}
               </div>`
            : ''}
          <div class="sub-card-time">
            <i class="fas fa-clock" style="margin-right:4px;"></i>${fmtTime(t.submittedAt)}
          </div>
          <div class="sub-detail">
            <hr class="card-divider">
            <div class="detail-val" style="white-space:pre-wrap;">${escHtml(t.description)}</div>
            <hr class="card-divider">
            <div class="chat-section" onclick="event.stopPropagation()">
              <div class="chat-section-title">
                <i class="fas fa-comments"></i> Chat
              </div>
              <div class="chat-messages" id="msgs-${t.id}">
                <div class="chat-empty"><i class="fas fa-spinner fa-spin"></i> Loading…</div>
              </div>
              ${isResolved
                ? `<div class="chat-resolved-note">
                     <i class="fas fa-check-circle" style="margin-right:5px;"></i>This ticket is resolved. Chat is read-only.
                   </div>`
                : `<div class="chat-input-row">
                    <input class="chat-input" id="chatIn-${t.id}" placeholder="Type a message…"
                      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendUserMsg('${t.id}')}" />
                    <button class="chat-send-btn" onclick="sendUserMsg('${t.id}')">
                      <i class="fas fa-paper-plane"></i>
                    </button>
                  </div>`
              }
            </div>
          </div>
        </div>`;
      }).join('');

      tickets.forEach(t => {
        if (expandedCards.has(t.id) && !chatListeners[t.id]) startChatListener(t.id);
      });
    }

    /* ─────────────────────────────────────────────────────────
       Card toggle
    ───────────────────────────────────────────────────────── */
    function toggleCard(id, panel) {
      if (expandedCards.has(id)) {
        expandedCards.delete(id);
        if (chatListeners[id]) { chatListeners[id](); delete chatListeners[id]; }
      } else {
        expandedCards.add(id);
        if (panel === 'opened') startChatListener(id);
      }
      renderMySubmissions();
    }

    /* ─────────────────────────────────────────────────────────
       Chat listener
    ───────────────────────────────────────────────────────── */
    function startChatListener(ticketId) {
      if (chatListeners[ticketId]) { chatListeners[ticketId](); delete chatListeners[ticketId]; }

      const unsub = db.collection('support').doc(ticketId)
        .collection('messages').orderBy('sentAt', 'asc')
        .onSnapshot(snap => {
          const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          renderChatMessages(ticketId, msgs);
        }, err => {
          const el = document.getElementById('msgs-' + ticketId);
          if (el) el.innerHTML = `<div class="chat-empty" style="color:#dc2626;">Could not load chat.</div>`;
        });

      chatListeners[ticketId] = unsub;
    }

    function renderChatMessages(ticketId, messages) {
      const el = document.getElementById('msgs-' + ticketId);
      if (!el) return;

      if (!messages.length) {
        el.innerHTML = '<div class="chat-empty">No messages yet — an admin will reply here.</div>';
        return;
      }

      let lastUserIdx  = -1;
      let lastAdminIdx = -1;
      messages.forEach((m, i) => {
        if (m.senderRole === 'admin') lastAdminIdx = i;
        else                          lastUserIdx  = i;
      });

      let html = '';
      messages.forEach((m, i) => {
        const isAdmin   = m.senderRole === 'admin';
        const sideClass = isAdmin ? 'chat-msg-admin' : 'chat-msg-user';
        let metaHtml = '';
        if (!isAdmin && i === lastUserIdx) {
          const name = m.senderName || currentUser?.displayName || 'You';
          const time = m.sentAt ? fmtTime(m.sentAt) : '';
          metaHtml = `<div class="chat-meta">${escHtml(name)} · ${time}</div>`;
        } else if (isAdmin && i === lastAdminIdx) {
          metaHtml = `<div class="chat-meta">admin</div>`;
        }
        html += `<div class="chat-msg ${sideClass}">
          <div class="chat-bubble">${escHtml(m.text || '')}</div>
          ${metaHtml}
        </div>`;
      });

      el.innerHTML = html;
      el.scrollTop = el.scrollHeight;
    }

    /* ─────────────────────────────────────────────────────────
       Send message (user → admin)
    ───────────────────────────────────────────────────────── */
    async function sendUserMsg(ticketId) {
      const input = document.getElementById('chatIn-' + ticketId);
      const text  = input?.value.trim();
      if (!text) return;
      input.value = '';
      try {
        await db.collection('support').doc(ticketId).collection('messages').add({
          text,
          senderId:   currentUser?.id          || 'user',
          senderName: currentUser?.displayName || currentUser?.username || 'User',
          senderRole: 'user',
          sentAt:     firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (e) {
        input.value = text;
        alert('Failed to send message: ' + e.message);
      }
    }
  </script>
</body>
