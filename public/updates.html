<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Updates – SVT MATCH</title>
  <link rel="icon" type="image/png" href="imgs/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" onload="this.rel='stylesheet'" />
  <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" onload="this.rel='stylesheet'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  </noscript>
  <link rel="stylesheet" href="/shared/svt.css" />


  <style>
    .container { max-width: 620px; margin: 0 auto; padding: 0 20px 60px; }
    header { display: flex; align-items: center; gap: 16px; padding: 32px 0 28px; }
    .page-title { font-size: 26px; font-weight: 900; }

    .loading { text-align: center; padding: 60px 20px; color: var(--faint); }
    .spinner {
      width: 36px; height: 36px; border: 3px solid rgba(232,136,158,0.2);
      border-top-color: var(--pink-deep); border-radius: 50%; margin: 0 auto 14px;
    }
    .empty { text-align: center; padding: 60px 20px; color: var(--faint); font-size: 14px; }
    .empty .empty-icon { font-size: 48px; margin-bottom: 14px; }

    .updates-list { display: flex; flex-direction: column; gap: 16px; }
    .update-card { border-radius: 20px; padding: 24px; }
    .update-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .update-badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px;
      background: var(--svt-soft); border: 1px solid rgba(255,255,255,0.7); border-radius: 20px;
      font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #475569;
    }
    .update-badge.latest { background: var(--svt-accent); border-color: transparent; color: white; }
    .update-date { font-size: 11px; color: var(--faint); font-weight: 500; white-space: nowrap; margin-top: 3px; }
    .update-title { font-size: 18px; font-weight: 800; color: var(--text); margin-bottom: 14px; line-height: 1.3; }
    .update-bullets { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .update-bullets li { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; color: #475569; line-height: 1.5; }
    .bullet-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--svt-accent); flex-shrink: 0; margin-top: 7px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <div class="page-title">Updates 📢</div>
        <div class="page-sub">Latest patch notes & new features</div>
      </div>
    </header>

    <div id="content">
      <div class="loading">
        <div class="spinner"></div>
        <div>Loading updates…</div>
      </div>
    </div>
  </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
    // ✏️ FILL IN YOUR FIREBASE CONFIG HERE
    const firebaseConfig = {
        apiKey: "AIzaSyBfpCJrqAul3meDQ764dUetTxQvf0_iOK8",
        authDomain: "svt-match.firebaseapp.com",
        databaseURL: "https://svt-match-default-rtdb.firebaseio.com",
        projectId: "svt-match",
        storageBucket: "svt-match.firebasestorage.app",
        messagingSenderId: "16709407764",
        appId: "1:16709407764:android:85fc7f8e04478fbe0c4301"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function esc(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function formatDate(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleDateString('en-HK', {
        timeZone: 'Asia/Hong_Kong',
        year: 'numeric', month: 'long', day: 'numeric'
      });
    }

    async function loadUpdates() {
      const content = document.getElementById('content');
      try {
        const snap = await db.collection('updates')
          .orderBy('publishedAt', 'desc')
          .get();

        if (snap.empty) {
          content.innerHTML = `
            <div class="empty">
              <div class="empty-icon">📭</div>
              No updates yet. Check back soon!
            </div>`;
          return;
        }

        let html = '<div class="updates-list">';
        snap.docs.forEach((doc, i) => {
          const d = doc.data();
          const isLatest = i === 0;
          const bullets = (d.bullets || []).map(b =>
            `<li><span class="bullet-dot"></span><span>${esc(b)}</span></li>`
          ).join('');

          html += `
            <div class="update-card" style="animation: svt-rise .45s var(--ease) backwards; animation-delay:${Math.min(i, 8) * 60}ms">
              <div class="update-header">
                <div>
                  <div class="update-badge ${isLatest ? 'latest' : ''}">
                    ${isLatest ? '✨ Latest' : '📋 Update'}
                  </div>
                </div>
                <div class="update-date">${formatDate(d.publishedAt)}</div>
              </div>
              <div class="update-title">${esc(d.title || 'Untitled Update')}</div>
              ${bullets ? `<ul class="update-bullets">${bullets}</ul>` : ''}
            </div>`;
        });
        html += '</div>';
        content.innerHTML = html;
      } catch (err) {
        console.error(err);
        content.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div>Failed to load updates. Try again later.</div>`;
      }
    }

    loadUpdates();
  </script>
</body>
</html>
