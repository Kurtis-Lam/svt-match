<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Updates – SVT MATCH</title>
  <link rel="icon" type="image/png" href="imgs/logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --pink: #f5c6d0; --blue: #9ec5d9;
      --pink-deep: #e8889e; --blue-deep: #5a9fc0;
      --bg1: #f8d7e0; --bg2: #a8d4e6;
      --glass: rgba(255,255,255,0.78);
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
      min-height: 100vh; color: #1e293b;
    }
    .container { max-width: 620px; margin: 0 auto; padding: 0 20px 60px; }

    header { display: flex; align-items: center; gap: 16px; padding: 32px 0 28px; }
    .back-btn {
      width: 40px; height: 40px; background: var(--glass);
      border: 1px solid rgba(255,255,255,0.7); border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; color: #475569; font-size: 16px;
      flex-shrink: 0; backdrop-filter: blur(10px);
    }
    .page-title {
      font-size: 26px; font-weight: 900;
      background: linear-gradient(90deg, var(--pink-deep), var(--blue-deep));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .page-sub { font-size: 13px; color: #64748b; margin-top: 2px; }

    /* LOADING */
    .loading {
      text-align: center; padding: 60px 20px; color: #94a3b8;
    }
    .spinner {
      width: 36px; height: 36px; border: 3px solid rgba(232,136,158,0.2);
      border-top-color: var(--pink-deep); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* EMPTY */
    .empty { text-align: center; padding: 60px 20px; color: #94a3b8; font-size: 14px; }
    .empty .empty-icon { font-size: 48px; margin-bottom: 14px; }

    /* UPDATE CARDS */
    .updates-list { display: flex; flex-direction: column; gap: 16px; }

    .update-card {
      background: var(--glass);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.07);
      animation: fadeUp 0.4s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .update-card:nth-child(1) { animation-delay: 0.05s; }
    .update-card:nth-child(2) { animation-delay: 0.10s; }
    .update-card:nth-child(3) { animation-delay: 0.15s; }
    .update-card:nth-child(4) { animation-delay: 0.20s; }
    .update-card:nth-child(5) { animation-delay: 0.25s; }

    .update-header {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 12px; margin-bottom: 14px;
    }
    .update-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px;
      background: linear-gradient(135deg, rgba(245,198,208,0.5), rgba(158,197,217,0.5));
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 20px;
      font-size: 10px; font-weight: 800;
      text-transform: uppercase; letter-spacing: 1px;
      color: #475569;
    }
    .update-badge.latest {
      background: linear-gradient(135deg, var(--pink-deep), var(--blue-deep));
      border-color: transparent; color: white;
    }
    .update-date {
      font-size: 11px; color: #94a3b8; font-weight: 500;
      white-space: nowrap; margin-top: 3px;
    }
    .update-title {
      font-size: 18px; font-weight: 800;
      color: #1e293b; margin-bottom: 14px; line-height: 1.3;
    }
    .update-bullets {
      list-style: none; display: flex; flex-direction: column; gap: 8px;
    }
    .update-bullets li {
      display: flex; align-items: flex-start; gap: 10px;
      font-size: 13px; color: #475569; line-height: 1.5;
    }
    .bullet-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: linear-gradient(135deg, var(--pink-deep), var(--blue-deep));
      flex-shrink: 0; margin-top: 7px;
    }
  
    @keyframes svtRise { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <div class="page-title">Updates 📢</div>
        <div class="page-sub">Latest patch notes & new features</div>
      </div>
    </header>

    <div id="content">
      <div class="loading">
        <div class="spinner"></div>
        <div>Loading updates…</div>
      </div>
    </div>
  </div>

  <script>
    // ✏️ FILL IN YOUR FIREBASE CONFIG HERE
    const firebaseConfig = {
        apiKey: "AIzaSyBfpCJrqAul3meDQ764dUetTxQvf0_iOK8",
        authDomain: "svt-match.firebaseapp.com",
        databaseURL: "https://svt-match-default-rtdb.firebaseio.com",
        projectId: "svt-match",
        storageBucket: "svt-match.firebasestorage.app",
        messagingSenderId: "16709407764",
        appId: "1:16709407764:android:85fc7f8e04478fbe0c4301"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function esc(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function formatDate(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleDateString('en-HK', {
        timeZone: 'Asia/Hong_Kong',
        year: 'numeric', month: 'long', day: 'numeric'
      });
    }

    async function loadUpdates() {
      const content = document.getElementById('content');
      try {
        const snap = await db.collection('updates')
          .orderBy('publishedAt', 'desc')
          .get();

        if (snap.empty) {
          content.innerHTML = `
            <div class="empty">
              <div class="empty-icon">📭</div>
              No updates yet. Check back soon!
            </div>`;
          return;
        }

        let html = '<div class="updates-list">';
        snap.docs.forEach((doc, i) => {
          const d = doc.data();
          const isLatest = i === 0;
          const bullets = (d.bullets || []).map(b =>
            `<li><span class="bullet-dot"></span><span>${esc(b)}</span></li>`
          ).join('');

          html += `
            <div class="update-card" style="animation: svtRise .45s cubic-bezier(.2,.8,.3,1) both; animation-delay:${Math.min(i, 8) * 60}ms">
              <div class="update-header">
                <div>
                  <div class="update-badge ${isLatest ? 'latest' : ''}">
                    ${isLatest ? '✨ Latest' : '📋 Update'}
                  </div>
                </div>
                <div class="update-date">${formatDate(d.publishedAt)}</div>
              </div>
              <div class="update-title">${esc(d.title || 'Untitled Update')}</div>
              ${bullets ? `<ul class="update-bullets">${bullets}</ul>` : ''}
            </div>`;
        });
        html += '</div>';
        content.innerHTML = html;
      } catch (err) {
        console.error(err);
        content.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div>Failed to load updates. Try again later.</div>`;
      }
    }

    loadUpdates();
  </script>
</body>
</html>
